[package]
name = "ofertas-rosario"
version = "0.1.0"
edition = "2024"
description = "Daily supermarket offers in Rosario, Argentina"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
csv = "1.4.0"
minijinja = { version = "3.1.0", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "native-tls-vendored", "cookies", "json", "gzip", "form", "query", "charset", "http2"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "thin"
codegen-units = 1
