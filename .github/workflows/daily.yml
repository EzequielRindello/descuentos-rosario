# Corrida diaria: scrapea, genera el sitio, lo publica en Cloudflare y guarda los datos en el repo.
# Secrets necesarios: CLOUDFLARE_API_TOKEN (permiso "Workers Scripts: Edit") y CLOUDFLARE_ACCOUNT_ID.
name: Ofertas del día

on:
  schedule:
    - cron: "0 10 * * *" # 07:00 en Argentina (UTC-3)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Scrape
        run: cargo run --release -- scrape

      - name: Generar sitio
        run: cargo run --release -- build

      - name: Publicar en Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guardar datos del día
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "data: ofertas del $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)"
            git push
          fi

      - name: Avisar si falló alguna cadena
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/run.json ] || exit 0
          failed=$(jq -r '.chains | to_entries[] | select(.value.ok == false) | "- **\(.key)**: \(.value.error)"' data/run.json)
          if [ -n "$failed" ]; then
            gh issue create \
              --title "Falló el scrape del $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)" \
              --body "$(printf 'Cadenas con error en la corrida %s:\n\n%s\n\nLa web sigue mostrando los datos anteriores de esas cadenas.' "$GITHUB_RUN_ID" "$failed")"
          fi
