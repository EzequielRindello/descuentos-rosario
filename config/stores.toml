# Cadenas y sucursales de Rosario que se leen todos los días.
# Cualquiera puede corregir este archivo con un PR, sin saber programar.
# Detalle técnico de cada fuente: docs/context.md

# Cómo se identifica el proyecto ante cada sitio: con la URL del repo, para que sepan quién lee y cómo.
user_agent = "OfertasRosario/0.1 (+https://github.com/EzequielRindello/descuentos-rosario)"

# Pausa entre requests a un mismo sitio, en milisegundos.
request_delay_ms = 1000

[carrefour]
enabled = true
store = "Carrefour Hiper Rosario Fisherton (Av. Circunvalación 1977 bis)"
# Cómo ver el mismo precio en la web de la cadena. Se muestra junto a sus ofertas.
hint = "Para ver estos precios en la web de Carrefour, elegí retiro en sucursal Hiper Rosario Fisherton. Con envío a domicilio pueden ser otros."
# Seller del Hiper Rosario Fisherton en la API de puntos de retiro (carrefourar0018_0018PR).
# La región se arma como base64("SW#<seller>"). Ojo: el código postal de Rosario para envío
# a domicilio da otra región, con vendedores de otras ciudades y a veces otros precios.
seller = "carrefourar0018"
# Categorías de supermercado (slugs de /api/catalog_system/pub/category/tree/1).
categories = [
  "almacen",
  "desayuno-y-merienda",
  "bebidas",
  "lacteos-y-productos-frescos",
  "carnes-y-pescados",
  "frutas-y-verduras",
  "panaderia",
  "congelados",
  "limpieza",
  "perfumeria-y-farmacia",
  "mundo-bebe",
  "mascotas",
]
# Se deja de leer una categoría cuando la página ya no trae descuentos de al menos este %.
min_discount_pct = 1

[coto]
enabled = true
store = "Coto Alto Rosario (Av. Junín y Thedy)"
hint = "Es el precio de Coto Digital, el mismo que muestra su web. Solo se incluyen productos que Coto marca como disponibles en Alto Rosario."
# Número interno de la sucursal. Filtra los productos disponibles en esa tienda.
store_id = "165"
# Resultados por request. La API acepta hasta 500 sin problemas.
page_size = 200
# Categorías de Coto que no son supermercado. Se descartan los productos que estén en alguna.
exclude_categories = ["Electro", "Textil", "Hogar", "Aire Libre"]

[dar]
enabled = true
store = "DAR"
hint = "Es el precio de la tienda online de DAR. Sus ofertas no tienen página propia, así que no hay enlace."

# Descuentos por banco (página /bancos/): nombre que se muestra para cada banco, tarjeta o
# billetera. La clave es lo que manda la cadena: en Coto el archivo del logo (es lo único que dice
# el banco), en Carrefour el nombre del banco o tarjeta. Los que no están se muestran con la clave
# limpia ("logo_naranjax2.png" queda "Naranjax"): si aparece uno nuevo, sumalo acá.
[promo_names]
"Personal_pay.png" = "Personal Pay"
"logo_amex1.png" = "American Express"
"logo_beneficios_anses.png" = "ANSES"
"logo_ciudad1.png" = "Banco Ciudad"
"logo_ciudadania_portena.png" = "Ciudadanía porteña"
"logo_columbia_1.png" = "Banco Columbia"
"logo_comafi2.png" = "Comafi"
"logo_comafi_unico.png" = "Comafi Único"
"logo_comunidad.png" = "Comunidad Coto"
"logo_credicoop.png" = "Credicoop"
"logo_galicia.png" = "Galicia"
"logo_icbc_1.png" = "ICBC"
"logo_jubiladosypensionados.png" = "Jubilados y pensionados"
"logo_macro_bma3.png" = "Macro"
"logo_mercadopago.png" = "Mercado Pago"
"logo_modo.png" = "MODO"
"logo_nacion_d.png" = "Banco Nación"
"logo_naranjax2.png" = "Naranja X"
"logo_patagonia2.png" = "Patagonia"
"logo_supervielle2.png" = "Supervielle"
"logo_tci.png" = "Tarjeta Coto TCI"
"logo_visa1.png" = "Visa"
"Cuenta Digital" = "Cuenta Digital Carrefour Banco"
"Tarjeta_Standard_Master_Carrefour" = "Tarjeta Carrefour Banco"
"Cuenta Dni" = "Cuenta DNI"

# Categorías propias del sitio: los recuadros de la portada y el filtro "Categoría", en este orden.
# Cada producto toma la primera que coincide:
# - Carrefour, por la categoría en la que se scrapeó (slugs de [carrefour] categories; si un
#   producto sale en dos, gana la que está antes en esa lista).
# - Coto, por los nombres de sus categorías (allAncestors.displayName, tal cual los escribe Coto,
#   con o sin tilde): primero las subcategorías (coto), después la sección entera (coto_section).
# - DAR no publica categorías: sus ofertas se encuentran buscando por texto.
# El id va en los datos y en la URL (?categoria=carnes): no cambiarlo sin avisar.
[[categories]]
id = "carnes"
name = "Carnes y pescados"
carrefour = ["carnes-y-pescados"]
# Carne, pollo y pescado sin elaborar. Hamburguesas, milanesas y rebozados van en Congelados, como en Carrefour.
coto = ["Carniceria", "Aves", "Pescaderia"]

[[categories]]
id = "frutas-y-verduras"
name = "Frutas y verduras"
carrefour = ["frutas-y-verduras"]
coto = ["Frutas y Verduras"]

[[categories]]
id = "lacteos"
name = "Lácteos y frescos"
carrefour = ["lacteos-y-productos-frescos"]
coto = ["Lácteos", "Quesos", "Fiambres", "Huevos", "Pastas Frescas y Tapas", "Comidas Elaboradas", "Comidas Refrigeradas"]
coto_section = ["Frescos"]

[[categories]]
id = "almacen"
name = "Almacén"
carrefour = ["almacen"]
coto_section = ["Almacén"]

[[categories]]
id = "desayuno"
name = "Desayuno y merienda"
carrefour = ["desayuno-y-merienda"]
# "Galletitas" está dentro de "Panaderia" en Coto; como esta categoría va antes, gana acá (como en Carrefour).
coto = ["Infusiones", "Cereales", "Endulzantes", "Mermeladas y Dulces", "Leche en Polvo", "Galletitas"]

[[categories]]
id = "panaderia"
name = "Panadería"
carrefour = ["panaderia"]
coto = ["Panaderia"]

[[categories]]
id = "bebidas"
name = "Bebidas"
carrefour = ["bebidas"]
coto_section = ["Bebidas"]

[[categories]]
id = "congelados"
name = "Congelados"
carrefour = ["congelados"]
coto_section = ["Congelados"]

[[categories]]
id = "limpieza"
name = "Limpieza"
carrefour = ["limpieza"]
coto_section = ["Limpieza"]

[[categories]]
id = "perfumeria"
name = "Perfumería y farmacia"
carrefour = ["perfumeria-y-farmacia"]
coto_section = ["Perfumería"]

[[categories]]
id = "bebes"
name = "Bebés"
carrefour = ["mundo-bebe"]
coto = ["Alimento de Bebés y Niños", "Pañales y Productos para Incontinencia", "Cuidado del Bebé y la Mamá"]

[[categories]]
id = "mascotas"
name = "Mascotas"
carrefour = ["mascotas"]
